{% extends 'base.html' %}

{% block title %}{{ post.title }} — Mi Blog{% endblock title %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <!-- Back link -->
    <a href="{% url 'blog:home' %}" class="inline-flex items-center text-gray-400 hover:text-violet-400 transition-colors duration-200 mb-8 text-sm group">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2 group-hover:-translate-x-1 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        Volver al blog
    </a>

    <!-- Article -->
    <article class="glass-card rounded-2xl p-10">
        <h1 class="text-3xl font-bold text-white mb-6">{{ post.title }}</h1>
        <div class="prose prose-invert max-w-none text-gray-300 leading-relaxed whitespace-pre-line">
            {{ post.content }}
        </div>
    </article>

    <!-- Actions -->
    <div class="flex items-center space-x-4 mt-6">
        <a href="{% url 'blog:update' post.id %}" class="glass-card inline-flex items-center px-5 py-2.5 rounded-xl text-sm font-medium text-gray-300 hover:text-violet-300 transition-all duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
            </svg>
            Editar
        </a>
        <a href="{% url 'blog:delete' post.id %}" class="glass-card inline-flex items-center px-5 py-2.5 rounded-xl text-sm font-medium text-gray-300 hover:text-red-400 transition-all duration-300">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            Eliminar
        </a>
    </div>
</div>
{% endblock content %}
