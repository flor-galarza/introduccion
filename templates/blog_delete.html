{% extends 'base.html' %}

{% block title %}Eliminar post — Mi Blog{% endblock title %}

{% block content %}
<div class="max-w-lg mx-auto">
    <!-- Back link -->
    <a href="{% url 'blog:home' %}" class="inline-flex items-center text-gray-400 hover:text-violet-400 transition-colors duration-200 mb-8 text-sm group">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2 group-hover:-translate-x-1 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        Volver al blog
    </a>

    <div class="glass-card rounded-2xl p-10 text-center">
        <!-- Warning icon -->
        <div class="w-16 h-16 rounded-full mx-auto mb-6 flex items-center justify-center" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2);">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>
        
        <h1 class="text-2xl font-bold text-white mb-2">Eliminar post</h1>
        <p class="text-gray-400 mb-2">¿Estás seguro de que querés eliminar este post?</p>
        <p class="text-red-400 text-sm mb-8">Esta acción no se puede deshacer.</p>

        <form method="POST">
            {% csrf_token %}
            <div class="flex items-center justify-center space-x-4">
                <button type="submit" class="bg-red-600 hover:bg-red-500 text-white px-8 py-3 rounded-xl text-sm font-semibold transition-all duration-300 shadow-lg hover:shadow-red-500/25">
                    Sí, eliminar
                </button>
                <a href="{% url 'blog:home' %}" class="glass-card px-8 py-3 rounded-xl text-sm font-medium text-gray-300 hover:text-white transition-all duration-300">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
