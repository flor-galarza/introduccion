{% extends 'base.html' %}

{% block title %}Nuevo Post — Mi Blog{% endblock title %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <!-- Back link -->
    <a href="{% url 'blog:home' %}" class="inline-flex items-center text-gray-400 hover:text-violet-400 transition-colors duration-200 mb-8 text-sm group">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2 group-hover:-translate-x-1 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
        Volver al blog
    </a>

    <div class="glass-card rounded-2xl p-10">
        <h1 class="text-3xl font-bold text-white mb-2">Crear nuevo post</h1>
        <p class="text-gray-400 mb-8">Compartí tus ideas con el mundo</p>

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-6">
                <label for="id_title" class="block text-sm font-medium text-gray-300 mb-2">Título</label>
                <input type="text" name="title" id="id_title" 
                       class="input-field w-full px-4 py-3 rounded-xl text-base"
                       placeholder="Escribí un título para tu post..."
                       required>
            </div>

            <div class="mb-8">
                <label for="id_content" class="block text-sm font-medium text-gray-300 mb-2">Contenido</label>
                <textarea name="content" id="id_content" rows="8"
                          class="input-field w-full px-4 py-3 rounded-xl text-base resize-y"
                          placeholder="¿Qué querés compartir hoy?"
                          required></textarea>
            </div>

            <div class="flex items-center space-x-4">
                <button type="submit" class="glow-btn text-white px-8 py-3 rounded-xl text-sm font-semibold">
                    Publicar Post →
                </button>
                <a href="{% url 'blog:home' %}" class="text-gray-400 hover:text-gray-300 text-sm transition-colors duration-200">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock content %}
